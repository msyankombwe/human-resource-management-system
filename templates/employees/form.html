{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<form method="post" class="bg-white border rounded p-4" style="max-width:720px">
  {% csrf_token %}
  {% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}<div class="text-danger small" id="{{ field.id_for_label }}-errors">{{ field.errors }}</div>{% endif %}
  </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-outline-secondary" href="{% url 'employees:list' %}">Cancel</a>
</form>
{% endblock %}
